name: Daily Research Pipeline & Private Dashboard

on:
  schedule:
    - cron: "0 22 * * *"   # 07:00 KST
  workflow_dispatch:
    inputs:
      markets:
        description: "Markets to run (space-separated: korea us)"
        required: false
        default: "korea us"

permissions:
  contents: read

concurrency:
  group: quant-daily-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "24"
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || '301c3fbffec59a5d5827040ff30eb62f' }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
  CLOUDFLARE_ACCESS_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN || secrets.CF_ACCESS_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
  CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME || 'quant-platform' }}
  DASHBOARD_ARTIFACT_KEY: ${{ secrets.DASHBOARD_ARTIFACT_KEY || secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}

jobs:
  research:
    name: Research Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Require private artifact encryption key
        run: |
          if [ -z "$DASHBOARD_ARTIFACT_KEY" ]; then
            echo "::error::DASHBOARD_ARTIFACT_KEY (or Cloudflare token fallback) is required."
            exit 1
          fi

      - name: Run real research and dashboard-data generation
        id: research-run
        run: |
          set +e
          python generate_dashboard_data.py --real --markets ${{ github.event.inputs.markets || 'korea us' }}
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          test -s site/data/dashboard.json || {
            echo "::error::Research did not produce site/data/dashboard.json"
            exit 1
          }
          if [ "$rc" -ne 0 ]; then
            echo "::warning::Research/status returned $rc; the quality job will inspect the honest blocked-state payload."
          fi

      - name: Build analyst/IB credibility dataset
        run: |
          python generate_consensus_accuracy.py || {
            echo "::warning::Analyst metadata enrichment failed; writing an empty, explicit coverage payload."
            python - <<'PY'
          import json, pathlib, pandas as pd
          p=pathlib.Path("site/data/consensus_accuracy.json")
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps({
            "schema_version":1,
            "generated_at":pd.Timestamp.now(tz="UTC").isoformat(),
            "coverage":{"korea_symbols":0,"us_symbols":0,"reports":0,"evaluations":0},
            "overall":None,"institutions":[],"analysts":[],"by_symbol":{},
            "source_notes_ko":["리포트 메타데이터 수집에 실패했습니다. 매매 후보 계산과는 분리되어 있습니다."]
          },ensure_ascii=False,indent=2),encoding="utf-8")
          PY
          }

      - name: Build backend-authoritative actionable signals
        run: |
          python generate_actionable_signals.py
          test -s site/data/actionable_signals.json

      - name: Encrypt private research payload
        run: |
          tar -czf research-output.tgz site/data reports
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000             -pass env:DASHBOARD_ARTIFACT_KEY             -in research-output.tgz -out research-output.tgz.enc
          rm -f research-output.tgz

      - name: Upload encrypted research artifact
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-research-${{ github.run_id }}
          path: research-output.tgz.enc
          retention-days: 1
          if-no-files-found: error

  data-quality:
    name: Data Quality Gate
    needs: research
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download encrypted research artifact
        uses: actions/download-artifact@v4
        with:
          name: encrypted-research-${{ github.run_id }}

      - name: Decrypt research payload
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000             -pass env:DASHBOARD_ARTIFACT_KEY             -in research-output.tgz.enc -out research-output.tgz
          tar -xzf research-output.tgz

      - name: Validate research JSON and freshness contract
        run: |
          python tools/verify_dashboard_build.py --site-dir site
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("site/data/dashboard.json").read_text())
          c=json.loads(Path("site/data/consensus_accuracy.json").read_text())
          assert d["data_source_mode"]=="real"
          assert d["publishability"]["publishable"] is True
          assert c["schema_version"]==1
          assert isinstance(c["by_symbol"],dict)
          a=json.loads(Path("site/data/actionable_signals.json").read_text())
          assert a["schema_version"]==2
          assert isinstance(a["signals"],list)
          assert all((s.get("action")!="BUY") or s.get("risk_cleared") for s in a["signals"])
          print("Data Quality Gate passed for deployable real/fresh payload and actionable contract.")
          PY

  dashboard-build:
    name: Dashboard Build
    needs: data-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download encrypted research artifact
        uses: actions/download-artifact@v4
        with:
          name: encrypted-research-${{ github.run_id }}

      - name: Decrypt research payload
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000             -pass env:DASHBOARD_ARTIFACT_KEY             -in research-output.tgz.enc -out research-output.tgz
          tar -xzf research-output.tgz

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard/package.json

      - name: Install frontend dependencies
        run: npm install --prefix dashboard --no-audit --no-fund

      - name: Build Korean React dashboard
        run: npm run build --prefix dashboard

      - name: Ensure alternate dashboard entry point
        run: cp site/index.html site/dashboard.html

      - name: Verify built dashboard
        run: python tools/verify_dashboard_build.py --site-dir site

      - name: Encrypt deployable site
        run: |
          tar -czf dashboard-site.tgz site
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000             -pass env:DASHBOARD_ARTIFACT_KEY             -in dashboard-site.tgz -out dashboard-site.tgz.enc
          rm -f dashboard-site.tgz

      - name: Upload encrypted dashboard site
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-dashboard-site-${{ github.run_id }}
          path: dashboard-site.tgz.enc
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy Private Dashboard
    needs: dashboard-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Cloudflare bootstrap dependency
        run: pip install requests

      - name: Download encrypted dashboard site
        uses: actions/download-artifact@v4
        with:
          name: encrypted-dashboard-site-${{ github.run_id }}

      - name: Decrypt deployable site
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000             -pass env:DASHBOARD_ARTIFACT_KEY             -in dashboard-site.tgz.enc -out dashboard-site.tgz
          tar -xzf dashboard-site.tgz
          test -s site/index.html
          test -s site/data/dashboard.json

      - name: Require Cloudflare Pages credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Cloudflare private deployment preflight
        id: cf-preflight
        run: |
          set +e
          python tools/cloudflare_pages.py preflight
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -eq 3 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Access management permission is not configured; private publish safely skipped."
          else
            exit "$rc"
          fi

      - name: Bootstrap private Pages + Access
        if: steps.cf-preflight.outputs.ready == 'true'
        run: python tools/cloudflare_pages.py bootstrap

      - name: Publish to Cloudflare Pages
        if: steps.cf-preflight.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }} --branch=master --commit-dirty=true

      - name: Verify root is authentication-protected
        if: steps.cf-preflight.outputs.ready == 'true'
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" "https://${CLOUDFLARE_PROJECT_NAME}.pages.dev/")
          echo "Anonymous HTTP status: $code"
          case "$code" in
            301|302|303|307|308|401|403) ;;
            200) echo "::error::Private dashboard is anonymously accessible"; exit 1 ;;
            *) echo "::error::Unexpected dashboard response HTTP $code"; exit 1 ;;
          esac

      - name: Record safe private-deploy skip
        if: steps.cf-preflight.outputs.ready != 'true'
        run: |
          echo "Private dashboard build is valid, but Cloudflare Access permission is not configured." >> "$GITHUB_STEP_SUMMARY"
          echo "No public fallback was attempted." >> "$GITHUB_STEP_SUMMARY"
