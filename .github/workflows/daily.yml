name: Daily Research Pipeline & Private Dashboard

on:
  schedule:
    - cron: "0 22 * * *"   # 07:00 KST
  push:
    branches: [master]
    paths:
      - "tools/daily_e2e.trigger"
  workflow_dispatch:
    inputs:
      markets:
        description: "Markets to run (space-separated: korea us)"
        required: false
        default: "korea us"

permissions:
  contents: read

concurrency:
  group: quant-daily-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "24"
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
  CLOUDFLARE_ACCESS_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN || secrets.CF_ACCESS_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
  CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME || 'quant-platform' }}
  DASHBOARD_ARTIFACT_KEY: ${{ secrets.DASHBOARD_ARTIFACT_KEY || secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}

jobs:
  round7-diagnostics:
    name: Round 7 US diagnostics
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      STOOQ_API_KEY: ${{ secrets.STOOQ_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Measure FISV and universe exclusions before remediation
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd() / "src"))
          from collections import Counter
          import pandas as pd
          from quant.data.us_provider import USDataProvider
          from quant.universe.engine import UniverseEngine
          from quant.universe.us_constituents import fetch_sp500_constituents, fetch_nasdaq100_constituents
          from quant.utils.calendar import default_as_of

          provider=USDataProvider()
          as_of=default_as_of("us")
          snapshot=UniverseEngine("us",provider).build(as_of)
          excluded=[m for m in snapshot.members if not m.included]
          reason_counts=Counter()
          for m in excluded:
              if m.exclusion_reasons:
                  reason_counts.update(m.exclusion_reasons)
              else:
                  reason_counts["unspecified"]+=1

          directory={s.symbol for s in provider.list_symbols(as_of)}
          sp500=set(fetch_sp500_constituents())
          ndx=set(fetch_nasdaq100_constituents())
          fisv=provider.get_ohlcv("FISV","2025-01-01",as_of)
          fi=provider.get_ohlcv("FI","2025-01-01",as_of)
          around=[]
          if fisv is not None and not fisv.empty:
              around=[str(pd.Timestamp(x).date()) for x in fisv.loc["2025-11-07":"2025-11-17"].index]

          payload={
              "as_of":as_of,
              "snapshot_total":len(snapshot.members),
              "snapshot_included":len(snapshot.included_symbols()),
              "snapshot_excluded":len(excluded),
              "exclusion_reason_counts":dict(sorted(reason_counts.items())),
              "excluded_no_price_data_count":sum("no_price_data" in m.exclusion_reasons for m in excluded),
              "excluded_stale_data_count":sum(any(r.startswith("stale_data(") for r in m.exclusion_reasons) for m in excluded),
              "excluded_size_cap_count":sum(any(r.startswith("below_universe_size_cap(") for r in m.exclusion_reasons) for m in excluded),
              "fisv":{
                  "directory_present":"FISV" in directory,
                  "sp500_present":"FISV" in sp500,
                  "nasdaq100_present":"FISV" in ndx,
                  "row_count":0 if fisv is None else len(fisv),
                  "first_date":None if fisv is None or fisv.empty else str(fisv.index.min().date()),
                  "last_date":None if fisv is None or fisv.empty else str(fisv.index.max().date()),
                  "dates_around_2025_11_12":around,
              },
              "fi":{
                  "directory_present":"FI" in directory,
                  "sp500_present":"FI" in sp500,
                  "nasdaq100_present":"FI" in ndx,
                  "row_count":0 if fi is None else len(fi),
                  "first_date":None if fi is None or fi.empty else str(fi.index.min().date()),
                  "last_date":None if fi is None or fi.empty else str(fi.index.max().date()),
              },
          }
          print("ROUND7_UNIVERSE_DIAGNOSTIC",json.dumps(payload,sort_keys=True))
          PY
      - name: Run latest US real-data pipeline and print aggregate verdicts
        run: |
          set +e
          python generate_dashboard_data.py --real --markets us --skip-tests
          rc=$?
          set -e
          DIAG_RC="$rc" python - <<'PY'
          import json,os
          from collections import Counter,defaultdict
          from pathlib import Path
          p=Path("site/data/dashboard.json")
          if not p.exists():
              raise SystemExit("dashboard.json missing")
          d=json.loads(p.read_text())
          us=(d.get("markets") or {}).get("us") or {}
          strategies=(d.get("strategies") or {}).get("us") or []
          approvals=Counter(str(x.get("approval_state") or "UNKNOWN") for x in strategies)
          reason_counts=Counter()
          by_state=defaultdict(Counter)
          for row in strategies:
              state=str(row.get("approval_state") or "UNKNOWN")
              for reason in row.get("approval_reasons") or []:
                  reason_counts[str(reason)]+=1
                  by_state[state][str(reason)]+=1
          overlays=Counter()
          for candidate in us.get("candidates") or []:
              action=((candidate.get("institutional_overlay") or {}).get("action") or "UNKNOWN")
              overlays[str(action)]+=1
          pub=d.get("publishability") or {}
          print("ROUND7_DASHBOARD_DIAGNOSTIC",json.dumps({
              "research_exit_code":int(os.environ["DIAG_RC"]),
              "overview":d.get("overview") or {},
              "publishable":pub.get("publishable"),
              "freshness":pub.get("markets") or {},
              "us_blocked":us.get("blocked"),
              "us_universe_size":us.get("universe_size"),
              "us_candidate_count":len(us.get("candidates") or []),
              "quality_quarantine":us.get("quality_quarantine") or {},
              "strategy_count":len(strategies),
              "approval_distribution":dict(approvals),
              "approval_reason_distribution":dict(reason_counts),
              "approval_reasons_by_state":{k:dict(v) for k,v in by_state.items()},
              "institutional_overlay_action_distribution":dict(overlays),
              "portfolio":(d.get("portfolio") or {}).get("us") or {},
              "portfolio_risk":(d.get("portfolio_risk") or {}).get("us") or {},
          },sort_keys=True))
          PY
          exit "$rc"

  research:
    name: Research Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      STOOQ_API_KEY: ${{ secrets.STOOQ_API_KEY }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Require private artifact encryption key
        run: |
          if [ -z "$DASHBOARD_ARTIFACT_KEY" ]; then
            echo "::error::DASHBOARD_ARTIFACT_KEY (recommended) or an existing Cloudflare token fallback is required to encrypt private workflow artifacts. Add DASHBOARD_ARTIFACT_KEY in Settings -> Secrets and variables -> Actions; never print the value."
            exit 1
          fi

      - name: Run real research and dashboard-data generation
        id: research-run
        run: |
          set +e
          python generate_dashboard_data.py --real --markets ${{ github.event.inputs.markets || 'korea us' }}
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          test -s site/data/dashboard.json || {
            echo "::error::Research did not produce site/data/dashboard.json"
            exit 1
          }
          if [ "$rc" -ne 0 ]; then
            echo "::warning::Research/status returned $rc; the quality job will inspect the honest blocked-state payload."
          fi

      - name: Build analyst/IB credibility dataset
        run: |
          python generate_consensus_accuracy.py || {
            echo "::warning::Analyst metadata enrichment failed; writing an empty, explicit coverage payload."
            python - <<'PY'
          import json, pathlib, pandas as pd
          p=pathlib.Path("site/data/consensus_accuracy.json")
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps({
            "schema_version":2,
            "generated_at":pd.Timestamp.now(tz="UTC").isoformat(),
            "coverage":{"korea_symbols":0,"us_symbols":0,"reports":0,"evaluations":0},
            "overall":None,"institutions":[],"analysts":[],"by_symbol":{},
            "source_notes_ko":["리포트 메타데이터 수집에 실패했습니다. 매매 후보 계산과는 분리되어 있습니다."]
          },ensure_ascii=False,indent=2),encoding="utf-8")
          PY
          }

      - name: Build backend-authoritative actionable signals
        run: |
          python generate_actionable_signals.py
          test -s site/data/actionable_signals.json

      - name: Encrypt private research payload
        run: |
          tar -czf research-output.tgz site/data reports
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000             -pass env:DASHBOARD_ARTIFACT_KEY             -in research-output.tgz -out research-output.tgz.enc
          rm -f research-output.tgz

      - name: Upload encrypted research artifact
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-research-${{ github.run_id }}
          path: research-output.tgz.enc
          retention-days: 1
          if-no-files-found: error

  data-quality:
    name: Data Quality Gate
    needs: research
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download encrypted research artifact
        uses: actions/download-artifact@v4
        with:
          name: encrypted-research-${{ github.run_id }}

      - name: Decrypt research payload
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000             -pass env:DASHBOARD_ARTIFACT_KEY             -in research-output.tgz.enc -out research-output.tgz
          tar -xzf research-output.tgz

      - name: Validate research JSON and freshness contract
        run: |
          python tools/verify_dashboard_build.py --site-dir site
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("site/data/dashboard.json").read_text())
          c=json.loads(Path("site/data/consensus_accuracy.json").read_text())
          assert d["data_source_mode"]=="real"
          assert d["publishability"]["publishable"] is True
          assert c["schema_version"]==2
          assert isinstance(c["by_symbol"],dict)
          a=json.loads(Path("site/data/actionable_signals.json").read_text())
          assert a["schema_version"]==2
          assert isinstance(a["signals"],list)
          assert all((s.get("action")!="BUY") or s.get("risk_cleared") for s in a["signals"])
          print("Data Quality Gate passed for deployable real/fresh payload and actionable contract.")
          PY

  dashboard-build:
    name: Dashboard Build
    needs: data-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download encrypted research artifact
        uses: actions/download-artifact@v4
        with:
          name: encrypted-research-${{ github.run_id }}

      - name: Decrypt research payload
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000             -pass env:DASHBOARD_ARTIFACT_KEY             -in research-output.tgz.enc -out research-output.tgz
          tar -xzf research-output.tgz

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard/package.json

      - name: Install frontend dependencies
        run: npm install --prefix dashboard --no-audit --no-fund

      - name: Build Korean React dashboard
        run: npm run build --prefix dashboard

      - name: Ensure alternate dashboard entry point
        run: cp site/index.html site/dashboard.html

      - name: Verify built dashboard
        run: python tools/verify_dashboard_build.py --site-dir site

      - name: Encrypt deployable site
        run: |
          tar -czf dashboard-site.tgz site
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000             -pass env:DASHBOARD_ARTIFACT_KEY             -in dashboard-site.tgz -out dashboard-site.tgz.enc
          rm -f dashboard-site.tgz

      - name: Upload encrypted dashboard site
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-dashboard-site-${{ github.run_id }}
          path: dashboard-site.tgz.enc
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy Private Dashboard
    needs: dashboard-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Cloudflare bootstrap dependency
        run: pip install requests

      - name: Download encrypted dashboard site
        uses: actions/download-artifact@v4
        with:
          name: encrypted-dashboard-site-${{ github.run_id }}

      - name: Decrypt deployable site
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000             -pass env:DASHBOARD_ARTIFACT_KEY             -in dashboard-site.tgz.enc -out dashboard-site.tgz
          tar -xzf dashboard-site.tgz
          test -s site/index.html
          test -s site/data/dashboard.json

      - name: Require Cloudflare Pages credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing. In Cloudflare Dashboard -> My Profile -> API Tokens, create a Custom token scoped to this account with Account -> Cloudflare Pages -> Edit (API: Pages Write), then save it in GitHub repository Settings -> Secrets and variables -> Actions as CLOUDFLARE_API_TOKEN. Never print the token."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is missing. Copy it from Cloudflare Dashboard -> Workers & Pages -> Account Details (or search 'Copy account ID'), then save it in GitHub repository Settings -> Secrets and variables -> Actions as CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi

      - name: Cloudflare private deployment preflight
        id: cf-preflight
        run: |
          set +e
          python tools/cloudflare_pages.py preflight
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -eq 3 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare Access permission is insufficient. Configure CLOUDFLARE_ACCESS_API_TOKEN with Account -> Access: Apps and Policies -> Edit (API: Access: Apps and Policies Write) and Account -> Access: Organizations, Identity Providers, and Groups -> Edit (API: Access: Organizations, Identity Providers, and Groups Write) for this account. Private publish safely skipped; no public fallback was attempted."
          else
            exit "$rc"
          fi

      - name: Bootstrap private Pages + Access
        if: steps.cf-preflight.outputs.ready == 'true'
        run: python tools/cloudflare_pages.py bootstrap

      - name: Publish to Cloudflare Pages
        if: steps.cf-preflight.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }} --branch=master --commit-dirty=true

      - name: Verify root is authentication-protected
        if: steps.cf-preflight.outputs.ready == 'true'
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" "https://${CLOUDFLARE_PROJECT_NAME}.pages.dev/")
          echo "Anonymous HTTP status: $code"
          case "$code" in
            301|302|303|307|308|401|403) ;;
            200) echo "::error::Private dashboard is anonymously accessible"; exit 1 ;;
            *) echo "::error::Unexpected dashboard response HTTP $code"; exit 1 ;;
          esac

      - name: Record safe private-deploy skip
        if: steps.cf-preflight.outputs.ready != 'true'
        run: |
          echo "Private dashboard build is valid, but Cloudflare Access permission is not configured." >> "$GITHUB_STEP_SUMMARY"
          echo "No public fallback was attempted." >> "$GITHUB_STEP_SUMMARY"
