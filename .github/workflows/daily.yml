name: Daily Research Pipeline & Dashboard

# 매일 07:00 KST 자동 실행(0 22 * * * UTC) + 07:15 KST 복구 실행 + 수동 실행.
# 복구 실행은 오늘자 대시보드 데이터가 이미 정상적으로 만들어져 있으면
# 아무것도 하지 않는다.
#
# FAIL-CLOSED:
# 리서치/검증 단계가 실패하면 대시보드를 새로 배포하지 않는다. 실패한
# 데이터나 불완전한 산출물을 최신 정상 대시보드 위에 덮어쓰지 않는다.
#
# --real: 실제 시장 데이터(pykrx / yfinance)를 쓴다. 이 옵션이 없으면
# 모든 스크립트가 합성(가짜) 데이터로 돌아가며, 그게 이 프로젝트가
# 실제로 겪었던 문제다 -- 진짜처럼 보이는 무작위 가격 대시보드.
#
# --as-of 는 의도적으로 넘기지 않는다. 3주 반 동안 매일 아침 파이프라인이
# 죽은 원인이 바로 그것이었다. 이 워크플로우는 07:00 Asia/Seoul 에 도는데,
# 그 시각 한국 장은 아직 열리지도 않았고(09:00 개장) 같은 날짜의 미국 장은
# 12시간 뒤다. 주말이면 아예 거래일조차 아니다. 그런 날짜를 요구하면
# 필수 검사인 freshness(max_lag_sessions: 0)가 존재할 수 없는 봉을 찾다가
# 매일 두 시장을 모두 Fail-Closed 시킨다. 이제는 각 스크립트가
# quant.utils.calendar.default_as_of() 로 **시장별로** 이미 종료된 최신
# 세션을 스스로 고른다.

on:
  schedule:
    - cron: "0 22 * * *"   # 07:00 KST daily (primary)
    - cron: "15 22 * * *"  # 07:15 KST daily (idempotent recovery)
  workflow_dispatch:
    inputs:
      markets:
        description: "Markets to run (space-separated: korea us)"
        required: false
        default: "korea us"
      param_search:
        description: "Run full parameter-search Walk-Forward (slow)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  research:
    name: Research Pipeline + Data Quality Gate + Dashboard Data
    runs-on: ubuntu-latest
    # 실데이터 실행은 외부 서버(KRX/Yahoo)에 시간이 달려 있다. 멈춘
    # 제공자 때문에 6시간을 쓰지 않도록 상한을 둔다.
    timeout-minutes: 150
    permissions:
      contents: write
    env:
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
    outputs:
      any_failure: ${{ steps.final-status.outputs.any_failure }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 복구 실행(07:15)은 첫 실행이 "오늘 날짜로, 게시 가능한" 데이터를
      # 이미 만들어 둔 경우에만 건너뛴다. 예전 버전은 as_of 만 비교해서,
      # 첫 실행이 실패해 낡은/합성 파일이 그대로 남아 있어도 복구 실행이
      # 스스로를 건너뛰었다 -- 복구 실행이 존재하는 이유를 정확히 무력화한 것.
      - name: Recovery-run idempotency check
        id: check
        run: |
          SKIP=false
          RUN_DATE=$(TZ=Asia/Seoul date +%F)
          if [ "${{ github.event.schedule }}" = "15 22 * * *" ]; then
            if [ -f site/data/dashboard.json ]; then
              FRESH=$(python3 tools/dashboard_state.py "$RUN_DATE" 2>/dev/null || echo "no")
              if [ "$FRESH" = "yes" ]; then
                echo "Today's ($RUN_DATE) dashboard data already exists and is publishable -- skipping recovery run."
                SKIP=true
              fi
            fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          echo "run_date=$RUN_DATE" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Data Validation (validate_data.py)
        if: steps.check.outputs.skip != 'true'
        id: data-validation
        continue-on-error: true
        run: python validate_data.py --market both --real

      - name: Paper Trading Update (run_paper.py)
        if: steps.check.outputs.skip != 'true'
        id: paper-trading
        continue-on-error: true
        run: |
          for market in korea us; do
            python run_paper.py --market "$market" --real || true
          done

      # 이 단계가 전체 리서치 파이프라인(+ reports/*.md 생성)과 시스템
      # 상태 점검을 한 번에 돌린다. 별도의 run_research.py 단계를 두면
      # 같은 날 데이터를 두 번 받아오고 워크포워드를 두 번 돌리게 된다.
      - name: Research Pipeline + System Validation + Dashboard Data
        if: steps.check.outputs.skip != 'true'
        id: dashboard-data
        continue-on-error: true
        run: |
          python generate_dashboard_data.py --real \
            --markets ${{ github.event.inputs.markets || 'korea us' }}

      - name: Upload daily-validation artifact
        if: always() && steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-validation-${{ steps.check.outputs.run_date }}
          path: |
            site/data/dashboard.json
          retention-days: 90
          if-no-files-found: warn

      - name: Upload daily-research artifact
        if: always() && steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-research-${{ steps.check.outputs.run_date }}
          path: |
            site/data/history.json
            reports/*.md
          retention-days: 90
          if-no-files-found: warn

      - name: Secret scan before commit (gitleaks)
        if: steps.check.outputs.skip != 'true'
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_NOTIFY_USER_LIST: ""

      - name: Commit dashboard data + report (compact, no raw prices)
        if: steps.check.outputs.skip != 'true' && steps.gitleaks.outcome == 'success'
        run: |
          git config user.name "quant-research-bot"
          git config user.email "quant-research-bot@users.noreply.github.com"
          git add site/data/dashboard.json site/data/history.json
          git add reports/*.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Daily update: ${{ steps.check.outputs.run_date }} (Asia/Seoul)"

          # The run takes the better part of an hour, and `master` moves
          # while it does -- the 07:15 recovery run, a code change, or this
          # workflow's own previous commit. A plain `git push` then loses to
          # a fast-forward rejection and the whole run is reported as a
          # failure even though the research succeeded. Rebase onto whatever
          # landed and try again; this commit only ever touches generated
          # output, so there is nothing for a rebase to conflict over.
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected (attempt $attempt) -- rebasing onto the current remote"
            # --no-tags/--depth: the checkout is shallow, so fetch enough to rebase on.
            git fetch origin "$GITHUB_REF_NAME" --depth=20 || git fetch origin "$GITHUB_REF_NAME"
            if ! git rebase "origin/$GITHUB_REF_NAME"; then
              git rebase --abort || true
              echo "::error::Could not rebase today's generated output onto the current branch."
              exit 1
            fi
          done
          echo "::error::Still could not push after 3 attempts -- the branch is being written to faster than this run can rebase."
          exit 1

      - name: Refuse to auto-commit if the secret scan itself failed to run cleanly
        if: steps.check.outputs.skip != 'true' && steps.gitleaks.outcome != 'success'
        run: |
          echo "::error::gitleaks did not complete successfully -- refusing to auto-commit."
          exit 1

      - name: Final job status (fail the run visibly if anything failed)
        id: final-status
        if: steps.check.outputs.skip != 'true'
        run: |
          ANY_FAILURE=false
          for outcome in \
            "${{ steps.data-validation.outcome }}" \
            "${{ steps.paper-trading.outcome }}" \
            "${{ steps.dashboard-data.outcome }}"; do
            if [ "$outcome" = "failure" ]; then
              ANY_FAILURE=true
            fi
          done
          echo "any_failure=$ANY_FAILURE" >> "$GITHUB_OUTPUT"
          if [ "$ANY_FAILURE" = "true" ]; then
            echo "::error::One or more pipeline steps failed today. Deployment is blocked and the last known-good private dashboard remains in place."
            exit 1
          fi

  # 대시보드는 공개 GitHub Pages 가 아니라 Cloudflare Access 뒤의
  # Cloudflare Pages 로 배포된다. 인증 문제를 "공개로 전환"으로 해결하는
  # 경로는 이 워크플로우에 존재하지 않는다(spec 122).
  deploy:
    name: Deploy dashboard to Cloudflare Pages (private, behind Access)
    needs: research
    if: needs.research.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (latest, including today's committed dashboard data)
        uses: actions/checkout@v4

      # 자격 증명이 없으면 배포는 실패로 끝난다. 절대 공개 호스트로
      # 대체 배포하지 않는다. "오늘 대시보드가 없다"는 되돌릴 수 있고
      # "리서치가 공개 인터넷에 올라갔다"는 되돌릴 수 없다.
      - name: Fail closed when deployment credentials are missing
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: "301c3fbffec59a5d5827040ff30eb62f"
        run: |
          MISSING=""
          if [ -z "$CF_TOKEN" ]; then MISSING="$MISSING CLOUDFLARE_API_TOKEN"; fi
          if [ -z "$CF_ACCOUNT" ]; then MISSING="$MISSING CLOUDFLARE_ACCOUNT_ID"; fi
          if [ -n "$MISSING" ]; then
            echo "::error::Missing GitHub Secret(s):$MISSING -- refusing to deploy. The dashboard is never published to a public host as a fallback."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # 업로드 직전, 실제로 올라갈 디렉터리를 대상으로 검사한다.
      # 특히 "DATA INTEGRITY PASS" 헤드라인 아래에 합성/낡은 데이터가
      # 깔려 있는 자기모순 상태를 잡는다 -- 실제로 게시됐던 상태다.
      - name: Ensure dashboard entry points
        run: |
          if [ -f site/dashboard.html ]; then
            cp site/dashboard.html site/index.html
          elif [ -f site/index.html ]; then
            cp site/index.html site/dashboard.html
          else
            echo "::error::Neither site/index.html nor site/dashboard.html exists."
            exit 1
          fi

      - name: Verify dashboard build before publishing
        run: python tools/verify_dashboard_build.py --site-dir site

      - name: Bootstrap/check Cloudflare private Pages configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "301c3fbffec59a5d5827040ff30eb62f"
        run: python tools/cloudflare_pages.py bootstrap

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "301c3fbffec59a5d5827040ff30eb62f"
          command: pages deploy site --project-name=quant-platform --branch=master --commit-dirty=true

      - name: Verify root URL is protected, not public
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" "https://quant-platform.pages.dev/")
          echo "Unauthenticated root HTTP status: $code"
          case "$code" in
            301|302|303|307|308|401|403) ;;
            200)
              echo "::error::Dashboard returned HTTP 200 without authentication."
              exit 1
              ;;
            *)
              echo "::error::Unexpected dashboard response: HTTP $code"
              exit 1
              ;;
          esac
