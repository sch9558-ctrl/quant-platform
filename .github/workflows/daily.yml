name: Daily Research Pipeline & Dashboard

# 매일 07:00 KST 자동 실행(0 22 * * * UTC) + 07:15 KST 복구 실행 + 수동 실행.
# 복구 실행은 오늘자 대시보드 데이터가 이미 있으면 아무것도 하지 않는다.
#
# FAIL-CLOSED, BUT DASHBOARD ALWAYS DEPLOYS:
# 리서치가 실패해도 대시보드 배포는 막지 않는다. 모든 파이프라인 단계는
# continue-on-error 로 돌고, deploy-pages 는 if: always() 로 실행된다.
# 실패 자체는 마지막 단계에서 워크플로우를 빨갛게 만들어 드러낸다.
#
# --real: 실제 시장 데이터(pykrx / yfinance)를 쓴다. 이 옵션이 없으면
# 모든 스크립트가 합성(가짜) 데이터로 돌아가며, 그게 이 프로젝트가
# 실제로 겪었던 문제다 -- 진짜처럼 보이는 무작위 가격 대시보드.

on:
  schedule:
    - cron: "0 22 * * *"   # 07:00 KST daily (primary)
    - cron: "15 22 * * *"  # 07:15 KST daily (idempotent recovery)
  workflow_dispatch:
    inputs:
      markets:
        description: "Markets to run (space-separated: korea us)"
        required: false
        default: "korea us"
      param_search:
        description: "Run full parameter-search Walk-Forward (slow)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  research:
    name: Research Pipeline + Data Quality Gate + Dashboard Data
    runs-on: ubuntu-latest
    # 실데이터 실행은 외부 서버(KRX/Yahoo)에 시간이 달려 있다. 멈춘
    # 제공자 때문에 6시간을 쓰지 않도록 상한을 둔다.
    timeout-minutes: 150
    permissions:
      contents: write
    outputs:
      any_failure: ${{ steps.final-status.outputs.any_failure }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Recovery-run idempotency check
        id: check
        run: |
          SKIP=false
          if [ "${{ github.event.schedule }}" = "15 22 * * *" ]; then
            TODAY_KST=$(TZ=Asia/Seoul date +%F)
            if [ -f site/data/dashboard.json ]; then
              AS_OF=$(python3 -c "import json;print(json.load(open('site/data/dashboard.json')).get('as_of',''))" 2>/dev/null || echo "")
              GENERATED_DATE=$(python3 -c "import json;print(json.load(open('site/data/dashboard.json')).get('generated_at','')[:10])" 2>/dev/null || echo "")
              if [ "$AS_OF" = "$TODAY_KST" ] && [ "$GENERATED_DATE" = "$TODAY_KST" ]; then
                echo "Today's ($TODAY_KST) dashboard data already exists -- skipping recovery run."
                SKIP=true
              fi
            fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          echo "as_of=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Data Validation (validate_data.py)
        if: steps.check.outputs.skip != 'true'
        id: data-validation
        continue-on-error: true
        run: python validate_data.py --market both --real --as-of "${{ steps.check.outputs.as_of }}"

      - name: Paper Trading Update (run_paper.py)
        if: steps.check.outputs.skip != 'true'
        id: paper-trading
        continue-on-error: true
        run: |
          for market in korea us; do
            python run_paper.py --market "$market" --real --as-of "${{ steps.check.outputs.as_of }}" || true
          done

      # 이 단계가 전체 리서치 파이프라인(+ reports/*.md 생성)과 시스템
      # 상태 점검을 한 번에 돌린다. 별도의 run_research.py 단계를 두면
      # 같은 날 데이터를 두 번 받아오고 워크포워드를 두 번 돌리게 된다.
      - name: Research Pipeline + System Validation + Dashboard Data
        if: steps.check.outputs.skip != 'true'
        id: dashboard-data
        continue-on-error: true
        run: |
          python generate_dashboard_data.py --real \
            --as-of "${{ steps.check.outputs.as_of }}" \
            --markets ${{ github.event.inputs.markets || 'korea us' }}

      - name: Upload daily-validation artifact
        if: always() && steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-validation-${{ steps.check.outputs.as_of }}
          path: |
            site/data/dashboard.json
          retention-days: 90
          if-no-files-found: warn

      - name: Upload daily-research artifact
        if: always() && steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-research-${{ steps.check.outputs.as_of }}
          path: |
            site/data/history.json
            reports/*.md
          retention-days: 90
          if-no-files-found: warn

      - name: Secret scan before commit (gitleaks)
        if: steps.check.outputs.skip != 'true'
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_NOTIFY_USER_LIST: ""

      - name: Commit dashboard data + report (compact, no raw prices)
        if: steps.check.outputs.skip != 'true' && steps.gitleaks.outcome == 'success'
        run: |
          git config user.name "quant-research-bot"
          git config user.email "quant-research-bot@users.noreply.github.com"
          git add site/data/dashboard.json site/data/history.json
          git add reports/*.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily update: ${{ steps.check.outputs.as_of }} (Asia/Seoul)"
            git push
          fi

      - name: Refuse to auto-commit if the secret scan itself failed to run cleanly
        if: steps.check.outputs.skip != 'true' && steps.gitleaks.outcome != 'success'
        run: |
          echo "::error::gitleaks did not complete successfully -- refusing to auto-commit."
          exit 1

      - name: Final job status (fail the run visibly if anything failed, without blocking dashboard deploy)
        id: final-status
        if: steps.check.outputs.skip != 'true'
        run: |
          ANY_FAILURE=false
          for outcome in \
            "${{ steps.data-validation.outcome }}" \
            "${{ steps.paper-trading.outcome }}" \
            "${{ steps.dashboard-data.outcome }}"; do
            if [ "$outcome" = "failure" ]; then
              ANY_FAILURE=true
            fi
          done
          echo "any_failure=$ANY_FAILURE" >> "$GITHUB_OUTPUT"
          if [ "$ANY_FAILURE" = "true" ]; then
            echo "::error::One or more pipeline steps failed today. The dashboard was still generated/deployed and reflects this failure honestly."
            exit 1
          fi

  deploy-pages:
    name: Deploy Static Dashboard to GitHub Pages
    needs: research
    if: always() && needs.research.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout (latest, including today's committed dashboard data)
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
