name: Round 7 US Diagnostics
on:
  push:
    branches: [master]
    paths: ["tools/round7_diag.trigger"]
permissions:
  contents: read
  actions: read
jobs:
  universe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Measure FISV and universe exclusions before remediation
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd() / "src"))
          from collections import Counter
          import pandas as pd
          from quant.data.us_provider import USDataProvider
          from quant.universe.engine import UniverseEngine
          from quant.universe.us_constituents import fetch_sp500_constituents, fetch_nasdaq100_constituents
          from quant.utils.calendar import default_as_of
          provider=USDataProvider()
          as_of=default_as_of("us")
          snapshot=UniverseEngine("us",provider).build(as_of)
          excluded=[m for m in snapshot.members if not m.included]
          reason_counts=Counter()
          for m in excluded:
              reason_counts.update(m.exclusion_reasons or ["unspecified"])
          directory={s.symbol for s in provider.list_symbols(as_of)}
          sp500=set(fetch_sp500_constituents()); ndx=set(fetch_nasdaq100_constituents())
          fisv=provider.get_ohlcv("FISV","2025-01-01",as_of)
          fi=provider.get_ohlcv("FI","2025-01-01",as_of)
          around=[] if fisv is None or fisv.empty else [str(pd.Timestamp(x).date()) for x in fisv.loc["2025-11-07":"2025-11-17"].index]
          payload={
            "as_of":as_of,"snapshot_total":len(snapshot.members),"snapshot_included":len(snapshot.included_symbols()),
            "snapshot_excluded":len(excluded),"exclusion_reason_counts":dict(sorted(reason_counts.items())),
            "excluded_no_price_data_count":sum("no_price_data" in m.exclusion_reasons for m in excluded),
            "excluded_stale_data_count":sum(any(r.startswith("stale_data(") for r in m.exclusion_reasons) for m in excluded),
            "excluded_size_cap_count":sum(any(r.startswith("below_universe_size_cap(") for r in m.exclusion_reasons) for m in excluded),
            "fisv":{"directory_present":"FISV" in directory,"sp500_present":"FISV" in sp500,"nasdaq100_present":"FISV" in ndx,
              "row_count":0 if fisv is None else len(fisv),"first_date":None if fisv is None or fisv.empty else str(fisv.index.min().date()),
              "last_date":None if fisv is None or fisv.empty else str(fisv.index.max().date()),"dates_around_2025_11_12":around},
            "fi":{"directory_present":"FI" in directory,"sp500_present":"FI" in sp500,"nasdaq100_present":"FI" in ndx,
              "row_count":0 if fi is None else len(fi),"first_date":None if fi is None or fi.empty else str(fi.index.min().date()),
              "last_date":None if fi is None or fi.empty else str(fi.index.max().date())}}
          print("ROUND7_UNIVERSE_DIAGNOSTIC",json.dumps(payload,sort_keys=True))
          PY

  payload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DASHBOARD_ARTIFACT_KEY: ${{ secrets.DASHBOARD_ARTIFACT_KEY || secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Require artifact key
        run: test -n "$DASHBOARD_ARTIFACT_KEY"
      - name: Download prior real research artifact
        uses: actions/download-artifact@v4
        with:
          name: encrypted-research-37555670664
          repository: sch9558-ctrl/quant-platform
          run-id: 37555670664
          github-token: ${{ github.token }}
      - name: Decrypt prior real research artifact
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:DASHBOARD_ARTIFACT_KEY -in research-output.tgz.enc -out research-output.tgz
          tar -xzf research-output.tgz
          test -s site/data/dashboard.json
      - name: Print candidate and approval diagnostics
        run: |
          python - <<'PY'
          import json
          from collections import Counter,defaultdict
          from pathlib import Path
          d=json.loads(Path("site/data/dashboard.json").read_text())
          us=(d.get("markets") or {}).get("us") or {}
          strategies=(d.get("strategies") or {}).get("us") or []
          approvals=Counter(str(x.get("approval_state") or "UNKNOWN") for x in strategies)
          reason_counts=Counter(); by_state=defaultdict(Counter)
          for row in strategies:
              state=str(row.get("approval_state") or "UNKNOWN")
              for reason in row.get("approval_reasons") or []:
                  reason_counts[str(reason)]+=1; by_state[state][str(reason)]+=1
          overlays=Counter(str(((c.get("institutional_overlay") or {}).get("action") or "UNKNOWN")) for c in us.get("candidates") or [])
          pub=d.get("publishability") or {}
          print("ROUND7_DASHBOARD_DIAGNOSTIC",json.dumps({
            "overview":d.get("overview") or {},"publishable":pub.get("publishable"),
            "freshness":pub.get("markets") or {},"us_blocked":us.get("blocked"),"us_universe_size":us.get("universe_size"),
            "us_candidate_count":len(us.get("candidates") or []),"quality_quarantine":us.get("quality_quarantine") or {},
            "strategy_count":len(strategies),"approval_distribution":dict(approvals),"approval_reason_distribution":dict(reason_counts),
            "approval_reasons_by_state":{k:dict(v) for k,v in by_state.items()},"institutional_overlay_action_distribution":dict(overlays),
            "portfolio":(d.get("portfolio") or {}).get("us") or {},"portfolio_risk":(d.get("portfolio_risk") or {}).get("us") or {},
            "paper_trading":(d.get("paper_trading") or {}).get("us") or {}
          },sort_keys=True))
          PY
