name: Probe — can this runner reach Korean market-data hosts?

# 진단 전용. 스케줄 없음, 시크릿 없음, 저장소에 아무것도 쓰지 않는다.
# 수동 실행(Run workflow)으로만 돈다.
#
# 왜 필요한가: pykrx 가 GitHub 러너에서 KRX 로부터 JSON 이 아닌 응답을
# 받는다(2026-09-30). 원인이 "날짜가 틀려서"가 아니라는 건 확인됐다 --
# 유효한 거래일(20260929)을 줘도 같은 응답이었다. 남은 가설은 이 러너의
# IP 자체가 거부된다는 것이고, 그렇다면 **한국 데이터 소스를 무엇으로
# 바꾸든 같은 벽에 부딪힌다.** 대체 소스를 고르기 전에 이 사실부터
# 확정해야 한다.
#
# 이 워크플로는 인증 키를 쓰지 않는다. 잘못된 키로도 "키가 등록되지
# 않았습니다" 같은 **애플리케이션 레벨 응답**이 오면 그 호스트는
# 도달 가능한 것이고, 연결 자체가 끊기면 막힌 것이다. HTTP 상태 코드만
# 보고 판단하면 안 된다 -- data.go.kr 은 등록되지 않은 키에 403 을
# 주는데, 그 403 은 "차단"이 아니라 "키가 없다"는 뜻이다.
#
# 결과는 단계 로그가 아니라 **Job Summary** 로 낸다. Actions 로그 뷰어는
# 앞부분만 렌더링해서 뒤쪽 결과를 읽을 수 없다.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Reachability probe (no secrets, no writes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe each candidate host
        run: |
          set -u
          {
            echo "## 한국 데이터 소스 도달 가능성 (GitHub 러너에서)"
            echo
            echo "러너 위치: \`$(curl -sS --max-time 15 https://ipinfo.io/json 2>/dev/null | tr -d '\n' | sed 's/"/ /g' | head -c 200)\`"
            echo
            echo "| 호스트 | http_code | 전송 오류 | 판정 | 응답 앞부분 |"
            echo "|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          probe() {
            label="$1"; url="$2"; shift 2
            : > /tmp/err.txt
            # -m 은 측정의 일부다: 막힌 호스트는 보통 응답 대신 멈춘다.
            code=$(curl -sS -o /tmp/body.txt -w '%{http_code}' -m 25 "$@" "$url" 2>/tmp/err.txt) || true
            err=$(tr -d '\n' < /tmp/err.txt | head -c 120)
            body=$(tr -d '\n|`' < /tmp/body.txt 2>/dev/null | head -c 120)

            # 판정: 본문이 있으면 그 호스트는 우리 요청을 처리한 것이다.
            # 상태 코드만으로는 "차단"과 "키 없음"을 구분할 수 없다.
            if [ -n "$body" ]; then
              verdict="도달 가능"
            elif [ -n "$err" ]; then
              verdict="**막힘**"
            else
              verdict="응답 없음"
            fi

            echo "| $label | ${code:-—} | ${err:-—} | $verdict | $body |" >> "$GITHUB_STEP_SUMMARY"
            echo "=== $label -> code=${code:-none} verdict=$verdict"
          }

          # 1) 공공데이터포털 (금융위원회) -- 무료 키, 일별 전종목 시세
          probe "data.go.kr 주식시세정보" \
            "https://apis.data.go.kr/1160100/service/GetStockSecuritiesInfoService/getStockPriceInfo?serviceKey=PROBE_ONLY_NOT_A_KEY&resultType=json&numOfRows=1"

          probe "data.go.kr KRX상장종목정보" \
            "https://apis.data.go.kr/1160100/GetKrxListedInfoService_V2/getItemInfo_V2?serviceKey=PROBE_ONLY_NOT_A_KEY&resultType=json&numOfRows=1"

          # 2) KRX 공식 오픈API
          probe "openapi.krx.co.kr" "https://openapi.krx.co.kr/"

          # 3) 한국투자증권 KIS -- 토큰 발급 엔드포인트 (빈 본문이면 4xx 가 정상)
          probe "KIS openapi tokenP" \
            "https://openapi.koreainvestment.com:9443/oauth2/tokenP" \
            -X POST -H 'content-type: application/json' -d '{}'

          # 4) pykrx 가 실제로 두드리는 곳 -- 현재 실패 원인 확정용
          probe "data.krx.co.kr (pykrx)" \
            "http://data.krx.co.kr/comm/bldAttendant/getJsonData.cmd" \
            -X POST -H 'user-agent: Mozilla/5.0' \
            -d 'bld=dbms/MDC/STAT/standard/MDCSTAT01501&mktId=STK&trdDd=20260929'

          # 5) FinanceDataReader 의 소스
          probe "finance.naver.com" "https://finance.naver.com/sise/"

          {
            echo
            echo "**읽는 법**: 응답 본문이 있으면 그 호스트는 요청을 처리한 것이다."
            echo "data.go.kr 의 \`403 SERVICE_KEY_IS_NOT_REGISTERED_ERROR\` 는 차단이 아니라"
            echo "키가 없다는 뜻이므로, 키만 발급받으면 동작한다는 근거가 된다."
            echo "반대로 전송 오류(연결 거부/타임아웃)는 이 러너에서 쓸 수 없다는 뜻이다."
          } >> "$GITHUB_STEP_SUMMARY"
