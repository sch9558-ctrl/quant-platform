name: Probe — what shape does data.go.kr actually return?

# 진단 전용. 스케줄 없음, 저장소에 아무것도 쓰지 않는다. 수동 실행만.
#
# 왜 필요한가: provider 를 문서 기억에 의존해서 쓰면 "자신 있게 틀린" 코드가
# 나온다. 1순위가 데이터 정확성인 프로젝트에서 그건 정확히 반대 방향이다.
# 코드를 쓰기 전에 **실제 응답의 필드 이름**을 한 번 찍어 본다.
#
# 2차 시도에서 다섯 경로 모두 빠르게 JSON 을 돌려줬지만 전부 오류 봉투
# (OpenAPI_ServiceResponse)였다. 즉 경로 문제가 아니라 **키가 받아들여지지
# 않는다**는 뜻인데, 어느 쪽인지 알려면 오류 문구를 봐야 한다.
#
# 가장 흔한 원인은 키의 형태다. 포털은 인증키를 Encoding(%2F, %2B, %3D 가
# 보이는 것)과 Decoding 두 가지로 준다. 이미 인코딩된 키를 다시 인코딩하면
# '%' 가 '%25' 가 되어 전혀 다른 문자열이 된다. 그래서 같은 요청을 키를
# 넘기는 두 가지 방식으로 각각 보내 본다 -- 어느 쪽이 통하는지가 곧
# provider 가 써야 할 방식이다. 저장된 키의 형태를 추측하지 않고 측정한다.
#
# 키 취급: env 로만 넘기고 URL 을 통째로 출력하지 않는다. 출력하는 값은
# 오류 문구와 공개 시세 데이터뿐이다.

on:
  workflow_dispatch:
    inputs:
      bas_dt:
        description: "조회 기준일 (YYYYMMDD). 공공데이터는 T+1 이라 어제보다 이전이 안전합니다."
        required: false
        default: "20261001"

permissions:
  contents: read

jobs:
  contract:
    name: Response contract probe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      BAS_DT: ${{ github.event.inputs.bas_dt || '20261001' }}
    steps:
      - name: Fail closed when the service key is missing
        run: |
          if [ -z "$SERVICE_KEY" ]; then
            echo "::error::DATA_GO_KR_SERVICE_KEY is not set -- nothing to probe."
            exit 1
          fi
          echo "service key present (value never printed)"

      - name: Probe each service, each key form, and report
        shell: bash
        run: |
          # Deliberately NOT `set -e`: every probe must run even when the one
          # before it failed. That is the whole point of a probe.
          set +e
          set -u

          S="$GITHUB_STEP_SUMMARY"

          # Shape of the stored key, without revealing it: only whether it
          # *looks* already-percent-encoded, and how long it is.
          shape="decoded처럼 보임"
          case "$SERVICE_KEY" in
            *%2F*|*%2B*|*%3D*|*%2f*|*%2b*|*%3d*) shape="**encoded 처럼 보임** (%2F/%2B/%3D 포함)";;
          esac
          {
            echo "## data.go.kr 응답 구조 (기준일 \`$BAS_DT\`)"
            echo
            echo "저장된 키: 길이 ${#SERVICE_KEY}자, $shape"
            echo
            echo "| # | 서비스 / 운영 | 키 전달 | http | 결과 |"
            echo "|---|---|---|---|---|"
          } >> "$S"

          N=0
          DETAIL=/tmp/detail.md
          : > "$DETAIL"

          probe() {
            N=$((N+1))
            local label="$1" url="$2" mode="$3"
            local out=/tmp/resp_$N.json err=/tmp/err_$N.txt
            : > "$out"; : > "$err"

            local code
            if [ "$mode" = "urlencode" ]; then
              # curl encodes the key for us -- correct for a Decoding key.
              code=$(curl -sS -G -o "$out" -w '%{http_code}' \
                      --connect-timeout 10 --max-time 30 \
                      --data-urlencode "serviceKey=$SERVICE_KEY" \
                      --data-urlencode "resultType=json" \
                      --data-urlencode "numOfRows=3" \
                      --data-urlencode "basDt=$BAS_DT" \
                      "$url" 2>"$err")
            else
              # key appended verbatim -- correct for an Encoding key, which is
              # already percent-encoded and must not be encoded again.
              code=$(curl -sS -o "$out" -w '%{http_code}' \
                      --connect-timeout 10 --max-time 30 \
                      "$url?serviceKey=$SERVICE_KEY&resultType=json&numOfRows=3&basDt=$BAS_DT" 2>"$err")
            fi

            local verdict="본문 없음 — $(tr -d '\n|' < "$err" | head -c 80)"
            if jq -e . "$out" >/dev/null 2>&1; then
              if jq -e '.response.body' "$out" >/dev/null 2>&1; then
                verdict="**데이터 수신** (totalCount $(jq -r '.response.body.totalCount // "?"' "$out"))"
              else
                # the error envelope -- the message is the whole point
                verdict="오류: $(jq -r '.. | .errMsg? // empty' "$out" | head -1) / $(jq -r '.. | .returnAuthMsg? // empty' "$out" | head -1)"
              fi
            elif [ -s "$out" ]; then
              verdict="JSON 아님: $(tr -d '\n|' < "$out" | head -c 80)"
            fi

            echo "| $N | $label | $mode | ${code:-000} | $verdict |" >> "$S"

            if jq -e '.response.body' "$out" >/dev/null 2>&1; then
              {
                echo
                echo "### $N. $label ($mode) — 성공"
                echo
                echo "필드 이름 (provider 가 맞춰야 할 계약):"
                echo
                echo '```'
                jq -r '(.response.body.items.item // .response.body.items // empty) | (if type=="array" then .[0] else . end) | keys_unsorted | .[]' "$out" 2>/dev/null | head -40
                echo '```'
                echo
                echo "첫 항목 (공개 시세값):"
                echo
                echo '```json'
                jq -c '(.response.body.items.item // .response.body.items // empty) | (if type=="array" then .[0] else . end)' "$out" 2>/dev/null | head -c 1000
                echo
                echo '```'
              } >> "$DETAIL"
            fi
          }

          B2=https://apis.data.go.kr/1160100/GetStockSecuritiesInfoService_V2
          B1=https://apis.data.go.kr/1160100/service/GetStockSecuritiesInfoService
          L2=https://apis.data.go.kr/1160100/GetKrxListedInfoService_V2

          for mode in urlencode verbatim; do
            probe "시세 _V2 / getStockPriceInfo_V2" "$B2/getStockPriceInfo_V2" "$mode"
            probe "시세 구경로 / getStockPriceInfo"  "$B1/getStockPriceInfo"    "$mode"
            probe "종목 _V2 / getItemInfo_V2"       "$L2/getItemInfo_V2"       "$mode"
          done

          cat "$DETAIL" >> "$S"

          {
            echo
            echo "**읽는 법**"
            echo
            echo "- \`데이터 수신\` 이 하나라도 있으면, 그 조합(경로 + 키 전달 방식)이 정답이다."
            echo "- 전부 \`SERVICE_KEY_IS_NOT_REGISTERED_ERROR\` 면 키가 아직 반영되지 않았거나"
            echo "  (등록 직후 수분~1시간), 다른 서비스의 키다."
            echo "- urlencode 만 실패하고 verbatim 이 되면 저장된 키가 Encoding 형태라는 뜻이고,"
            echo "  그 반대면 Decoding 형태라는 뜻이다. provider 는 측정된 쪽을 쓴다."
          } >> "$S"

          echo "probe finished; see the job summary"
