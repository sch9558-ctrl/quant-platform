name: Deploy Private Dashboard

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Fail closed when Cloudflare token is missing
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN"
            exit 1
          fi

      - name: Ensure dashboard entry points
        run: |
          if [ -f site/dashboard.html ]; then
            cp site/dashboard.html site/index.html
          elif [ -f site/index.html ]; then
            cp site/index.html site/dashboard.html
          else
            echo "::error::Neither site/index.html nor site/dashboard.html exists."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify dashboard build
        run: python tools/verify_dashboard_build.py --site-dir site

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "301c3fbffec59a5d5827040ff30eb62f"
          command: pages deploy site --project-name=quant-platform --branch=main
