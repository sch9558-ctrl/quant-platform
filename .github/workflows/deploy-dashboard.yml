name: Bootstrap / Deploy Private Dashboard

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/deploy-dashboard.yml"
      - "tools/cloudflare_pages.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: "301c3fbffec59a5d5827040ff30eb62f"
  CLOUDFLARE_PROJECT_NAME: "quant-platform"
  CLOUDFLARE_PAGES_HOSTNAME: "quant-platform.pages.dev"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Fail closed when Cloudflare token is missing
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Cloudflare bootstrap dependency
        run: python -m pip install requests

      - name: Ensure dashboard entry points
        run: |
          if [ -f site/dashboard.html ]; then
            cp site/dashboard.html site/index.html
          elif [ -f site/index.html ]; then
            cp site/index.html site/dashboard.html
          else
            echo "::error::Neither site/index.html nor site/dashboard.html exists."
            exit 1
          fi

      - name: Verify dashboard build
        run: python tools/verify_dashboard_build.py --site-dir site

      - name: Bootstrap Pages project and private Access policy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python tools/cloudflare_pages.py bootstrap

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=quant-platform --branch=master --commit-dirty=true

      - name: Verify root URL is protected, not public
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" "https://$CLOUDFLARE_PAGES_HOSTNAME/")
          echo "Unauthenticated root HTTP status: $code"
          case "$code" in
            301|302|303|307|308|401|403) ;;
            200)
              echo "::error::Dashboard returned HTTP 200 without authentication; refusing to call this private."
              exit 1
              ;;
            *)
              echo "::error::Unexpected dashboard response: HTTP $code"
              exit 1
              ;;
          esac
