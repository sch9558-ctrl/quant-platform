name: Bootstrap / Deploy Private Dashboard

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/deploy-dashboard.yml"
      - "tools/cloudflare_pages.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
  CLOUDFLARE_ACCESS_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN || secrets.CF_ACCESS_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || '301c3fbffec59a5d5827040ff30eb62f' }}
  CLOUDFLARE_PROJECT_NAME: "quant-platform"
  CLOUDFLARE_PAGES_HOSTNAME: "quant-platform.pages.dev"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Fail closed when Cloudflare token is missing
        env:
          CF_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing. Create a Cloudflare Custom API token for this account with Account -> Cloudflare Pages -> Edit (API: Pages Write), then save it in GitHub repository Settings -> Secrets and variables -> Actions as CLOUDFLARE_API_TOKEN. Never print the token."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Cloudflare bootstrap dependency
        run: python -m pip install requests

      - name: Prepare Site Directory
        run: |
          mkdir -p site
          if [ -f reports/dashboard.html ]; then
            cp reports/dashboard.html site/dashboard.html
            cp reports/dashboard.html site/index.html
          elif [ -f site/dashboard.html ]; then
            cp site/dashboard.html site/index.html
          elif [ -f site/index.html ]; then
            cp site/index.html site/dashboard.html
          else
            printf '%s\n' '<html><body><h1>Quant Research Dashboard</h1><p>Initializing...</p></body></html>' > site/index.html
            cp site/index.html site/dashboard.html
          fi
          test -s site/index.html
          test -s site/dashboard.html
          ls -la site

      - name: Verify dashboard build
        run: python tools/verify_dashboard_build.py --site-dir site

      - name: Cloudflare private deployment preflight
        id: cf-preflight
        run: |
          set +e
          python tools/cloudflare_pages.py preflight
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$rc" -eq 3 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare Access permission is insufficient. Configure CLOUDFLARE_ACCESS_API_TOKEN with Account -> Access: Apps and Policies -> Edit and Account -> Access: Identity Providers -> Edit. Private deployment is safely skipped; no public fallback was attempted."
            exit 0
          fi
          exit "$rc"

      - name: Bootstrap Pages project and private Access policy
        run: python tools/cloudflare_pages.py bootstrap
        if: steps.cf-preflight.outputs.ready == 'true'

      - name: Publish to Cloudflare Pages
        if: steps.cf-preflight.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=quant-platform --branch=master --commit-dirty=true

      - name: Verify root URL is protected, not public
        if: steps.cf-preflight.outputs.ready == 'true'
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" "https://$CLOUDFLARE_PAGES_HOSTNAME/")
          echo "Unauthenticated root HTTP status: $code"
          case "$code" in
            301|302|303|307|308|401|403) ;;
            200)
              echo "::error::Dashboard returned HTTP 200 without authentication; refusing to call this private."
              exit 1
              ;;
            *)
              echo "::error::Unexpected dashboard response: HTTP $code"
              exit 1
              ;;
          esac

      - name: Record safe deployment skip
        if: steps.cf-preflight.outputs.ready != 'true'
        run: |
          echo "## Private dashboard deployment skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "Cloudflare Pages was not published because Access management permission is not configured." >> "$GITHUB_STEP_SUMMARY"
          echo "Add CLOUDFLARE_ACCESS_API_TOKEN with Access: Apps and Policies Edit + Access: Identity Providers Edit for this account." >> "$GITHUB_STEP_SUMMARY"
