# Risk Manager limits. All Paper/Live orders must pass through these checks
# (src/quant/risk/manager.py) before being accepted.

position_limits:
  max_position_weight: 0.10        # single name, % of portfolio NAV
  max_sector_weight: 0.30
  max_strategy_weight: 0.40
  max_market_weight: 0.70          # e.g. cap on Korea-only or US-only exposure
  min_cash_weight: 0.05
  max_gross_exposure: 1.0          # no leverage by default

loss_limits:
  max_daily_loss_pct: 0.03         # halt new entries for the day past this loss
  max_drawdown_pct: 0.20           # de-risk / flatten past this drawdown from peak
  consecutive_loss_limit: 5        # trades; trigger a review after this streak

position_sizing:
  method: "volatility_target"      # fixed | volatility_target | signal_weight
  target_annual_vol: 0.15
  vol_lookback_days: 20
  max_leverage: 1.0

stops:
  use_stop_loss: true
  stop_loss_pct: 0.08
  use_trailing_stop: true
  trailing_stop_pct: 0.10

correlation:
  max_pairwise_correlation: 0.85
  correlation_lookback_days: 60
  max_correlated_cluster_weight: 0.25
